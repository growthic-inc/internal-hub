<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Growthic One</title>
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="./assets/css/components.css">
</head>
<body class="auth-body">

  <div class="auth-container">

    <div class="auth-brand">
      <img class="auth-brand-mark" src="./assets/img/logo.jpg" alt="Growthic One">
      <div>
        <div class="auth-brand-name">Growthic One</div>
        <div class="auth-brand-sub">Internal Operations Hub</div>
      </div>
    </div>

    <!-- LOGIN FORM (default) -->
    <div class="auth-card" id="card-login">
      <h1 class="auth-title">Sign in to your account</h1>
      <p class="auth-subtitle">Use your Growthic email and password</p>

      <div id="auth-error" class="alert alert-danger" style="display:none;"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Email address</label>
          <input class="form-input" type="email" id="email" placeholder="name@thegrowthic.com" autocomplete="email" required>
        </div>

        <div class="form-group" style="margin-bottom:20px;">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
            <label class="form-label" for="password" style="margin-bottom:0;">Password</label>
            <a href="/forgot-password" style="font-size:12px;color:var(--primary);text-decoration:none;font-weight:500;">Forgot password?</a>
          </div>
          <div class="input-wrapper">
            <input class="form-input" type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>
            <button type="button" class="input-suffix" id="toggle-pw" title="Show password">
              <svg id="icon-eye" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              <svg id="icon-eye-off" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-full btn-lg" id="login-btn">Sign In</button>
      </form>
    </div>

    <!-- SET PASSWORD FORM (shown when invite link is opened) -->
    <div class="auth-card" id="card-set-password" style="display:none;">
      <h1 class="auth-title">Set your password</h1>
      <p class="auth-subtitle">Choose a password to activate your account</p>

      <div id="set-pw-error" class="alert alert-danger" style="display:none;"></div>
      <div id="set-pw-success" class="alert alert-success" style="display:none;"></div>

      <form id="set-password-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="new-password">New password</label>
          <div class="input-wrapper">
            <input class="form-input" type="password" id="new-password" placeholder="At least 8 characters" autocomplete="new-password" required>
            <button type="button" class="input-suffix" id="toggle-new-pw" title="Show password">
              <svg id="icon-eye-2" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              <svg id="icon-eye-off-2" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
            </button>
          </div>
        </div>

        <div class="form-group" style="margin-bottom:20px;">
          <label class="form-label" for="confirm-password">Confirm password</label>
          <input class="form-input" type="password" id="confirm-password" placeholder="Re-enter your password" autocomplete="new-password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-full btn-lg" id="set-pw-btn">Activate Account</button>
      </form>
    </div>

    <p class="auth-footer">Growthic (Apinzo Technologies) &middot; Internal use only</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./assets/js/config.js"></script>
  <script src="./assets/js/auth.js"></script>
  <script>
    // Detect invite token in URL hash before doing anything else
    const hashParams = new URLSearchParams(window.location.hash.slice(1))
    const isInvite   = hashParams.get('type') === 'invite'

    if (isInvite) {
      // Show set-password card, hide login card
      document.getElementById('card-login').style.display        = 'none'
      document.getElementById('card-set-password').style.display = 'block'
    } else {
      // Normal login flow — redirect if already signed in
      Auth.requireGuest()

      const params = new URLSearchParams(window.location.search)
      if (params.get('reason') === 'deactivated') {
        const e = document.getElementById('auth-error')
        e.textContent   = 'Your account has been deactivated. Contact your admin.'
        e.style.display = 'block'
      }
    }

    // ── Login form ────────────────────────────────────────────
    document.getElementById('toggle-pw').addEventListener('click', () => {
      const input   = document.getElementById('password')
      const eyeOn   = document.getElementById('icon-eye')
      const eyeOff  = document.getElementById('icon-eye-off')
      const showing = input.type === 'text'
      input.type           = showing ? 'password' : 'text'
      eyeOn.style.display  = showing ? 'block' : 'none'
      eyeOff.style.display = showing ? 'none'  : 'block'
    })

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault()
      const errEl = document.getElementById('auth-error')
      const btn   = document.getElementById('login-btn')
      errEl.style.display = 'none'
      btn.disabled    = true
      btn.textContent = 'Signing in…'

      const email    = document.getElementById('email').value.trim()
      const password = document.getElementById('password').value

      if (!email || !password) {
        errEl.textContent   = 'Please enter your email and password.'
        errEl.style.display = 'block'
        btn.disabled    = false
        btn.textContent = 'Sign In'
        return
      }

      const { error } = await Auth.signIn(email, password)

      if (error) {
        errEl.textContent = error.message === 'Invalid login credentials'
          ? 'Incorrect email or password. Please try again.'
          : error.message
        errEl.style.display = 'block'
        btn.disabled    = false
        btn.textContent = 'Sign In'
      } else {
        window.location.href = '/home'
      }
    })

    // ── Set-password form (invite flow) ───────────────────────
    document.getElementById('toggle-new-pw').addEventListener('click', () => {
      const input   = document.getElementById('new-password')
      const eyeOn   = document.getElementById('icon-eye-2')
      const eyeOff  = document.getElementById('icon-eye-off-2')
      const showing = input.type === 'text'
      input.type           = showing ? 'password' : 'text'
      eyeOn.style.display  = showing ? 'block' : 'none'
      eyeOff.style.display = showing ? 'none'  : 'block'
    })

    document.getElementById('set-password-form').addEventListener('submit', async (e) => {
      e.preventDefault()
      const errEl   = document.getElementById('set-pw-error')
      const succEl  = document.getElementById('set-pw-success')
      const btn     = document.getElementById('set-pw-btn')
      const pw      = document.getElementById('new-password').value
      const confirm = document.getElementById('confirm-password').value

      errEl.style.display  = 'none'
      succEl.style.display = 'none'

      if (pw.length < 8) {
        errEl.textContent   = 'Password must be at least 8 characters.'
        errEl.style.display = 'block'
        return
      }
      if (pw !== confirm) {
        errEl.textContent   = 'Passwords do not match.'
        errEl.style.display = 'block'
        return
      }

      btn.disabled    = true
      btn.textContent = 'Activating…'

      // Supabase picks up the invite session from the URL hash automatically.
      // updateUser sets the password for the already-established session.
      const { error } = await Config.supabase.auth.updateUser({ password: pw })

      if (error) {
        errEl.textContent   = error.message
        errEl.style.display = 'block'
        btn.disabled        = false
        btn.textContent     = 'Activate Account'
      } else {
        succEl.textContent   = 'Password set! Redirecting you to the app…'
        succEl.style.display = 'block'
        setTimeout(() => { window.location.href = '/home' }, 1500)
      }
    })
  </script>
</body>
</html>
