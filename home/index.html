<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Growthic One</title>
  <link rel="icon" type="image/x-icon" href="../assets/img/favicon/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/img/favicon/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/img/favicon/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Growthic One">
  <script src="https://js.sentry-cdn.com/8be1d4537c988c206543f5bfb9f2c31d.min.js" crossorigin="anonymous"></script>
  <!-- Prevent flash of wrong theme: apply saved preference before CSS paints -->
  <script>(function(){var t=localStorage.getItem('theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');})()</script>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/mobile.css">
  <meta name="theme-color" content="#0F4799">
</head>
<body class="app-body">

  <div class="app-layout">

    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <img class="sidebar-logo-mark" src="../assets/img/logo.jpg" alt="Growthic One">
        <div>
          <span class="sidebar-brand">Growthic One</span>
          <span class="sidebar-brand-sub">Internal Hub</span>
        </div>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-footer" id="sidebar-footer"></div>
    </aside>

    <div class="main-wrapper">
      <header class="app-header">
        <button class="hamburger-btn" id="hamburger-btn" aria-label="Open navigation" title="Menu">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="6"  x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <h1 class="page-title" id="page-title">Loading…</h1>
        <div class="header-actions">
          <button class="btn-icon" id="theme-toggle-btn" title="Toggle dark mode" aria-label="Toggle dark mode">
            <!-- Sun icon — shown in dark mode (click to go light) -->
            <svg id="theme-icon-sun" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            <!-- Moon icon — shown in light mode (click to go dark) -->
            <svg id="theme-icon-moon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
          <button class="btn-icon" id="notif-btn" title="Notifications">
            <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            <span class="notif-badge" id="notif-badge" style="display:none;">0</span>
          </button>
          <div class="user-menu-wrap" id="user-menu-wrap">
            <button class="user-avatar-btn" id="user-avatar-btn" title="Account">
              <div class="user-avatar" id="user-avatar">--</div>
            </button>
            <div class="user-dropdown" id="user-dropdown" style="display:none;">
              <div class="user-dropdown-info" id="user-dropdown-info"></div>
              <a class="user-dropdown-item" href="#settings">Settings</a>
              <button class="user-dropdown-item user-dropdown-item--danger" id="logout-btn">Sign Out</button>
            </div>
          </div>
        </div>
      </header>

      <main class="page-content" id="page-content">
        <div class="page-loading">Loading…</div>
      </main>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <!-- SheetJS: client-side XLS/XLSX parsing for analytics upload -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/shell.js"></script>
  <script src="../assets/js/platform-config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/module-registry.js"></script>
  <script src="../assets/js/pages/client-dashboard.js"></script>
  <script src="../assets/js/pages/client-directory.js"></script>
  <script src="../assets/js/pages/master-folders.js"></script>
  <script src="../assets/js/pages/timesheet.js"></script>
  <script src="../assets/js/pages/reimbursements.js"></script>
  <script src="../assets/js/pages/assets.js"></script>
  <script src="../assets/js/pages/tools.js"></script>
  <script src="../assets/js/pages/access-control.js"></script>
  <script src="../assets/js/pages/permissions.js"></script>
  <!-- Phase 7: HR modules must load before access.js so their
       ModuleRegistry.register() calls are captured at parse time -->
  <script src="../assets/js/pages/people.js"></script>
  <script src="../assets/js/pages/leave-tracker.js"></script>
  <script src="../assets/js/pages/announcements.js"></script>
  <script src="../assets/js/pages/policies.js"></script>
  <script src="../assets/js/pages/access.js"></script>
  <script src="../assets/js/pages/settings.js"></script>
  <!-- Phase 8 -->
  <script src="../assets/js/pages/home.js"></script>
  <script src="../assets/js/push.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .catch(err => console.warn('[SW] Registration failed:', err))
      })

      // When a new service worker takes control (after cache version bump +
      // skipWaiting + clients.claim), reload once so the page runs the
      // latest JS/CSS instead of what was already in memory.
      let _swReloading = false
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (_swReloading) return
        _swReloading = true
        window.location.reload()
      })
    }
  </script>

</body>
</html>
