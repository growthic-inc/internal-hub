<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Growthic HRMS</title>
  <link rel="icon" type="image/x-icon" href="../../assets/img/favicon/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="../../assets/img/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../../assets/img/favicon/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../../assets/img/favicon/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Growthic HRMS">
  <script>(function(){var t=localStorage.getItem('theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');})()</script>
  <!-- Shared styles from /home/ -->
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/mobile.css">
  <!-- HRMS-specific styles -->
  <link rel="stylesheet" href="./assets/css/hrms.css">
  <meta name="theme-color" content="#0F4799">
</head>
<body class="app-body">

  <div class="app-layout">

    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <img class="sidebar-logo-mark" src="../../assets/img/logo.jpg" alt="Growthic One">
        <div>
          <span class="sidebar-brand">Growthic HRMS</span>
          <span class="sidebar-brand-sub">HR & Admin Portal</span>
        </div>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-footer" id="sidebar-footer"></div>
    </aside>

    <div class="main-wrapper">
      <header class="app-header">
        <button class="hamburger-btn" id="hamburger-btn" aria-label="Open navigation" title="Menu">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="6"  x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <h1 class="page-title" id="page-title">Loading…</h1>
        <div class="header-actions">
          <!-- Back to main app -->
          <a href="/home" class="btn btn--ghost btn--sm hrms-back-btn" title="Back to Growthic One">
            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            Main App
          </a>
          <button class="btn-icon" id="theme-toggle-btn" title="Toggle dark mode" aria-label="Toggle dark mode">
            <svg id="theme-icon-sun" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            <svg id="theme-icon-moon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
          <div class="user-menu-wrap" id="user-menu-wrap">
            <button class="user-avatar-btn" id="user-avatar-btn" title="Account">
              <div class="user-avatar" id="user-avatar">--</div>
            </button>
            <div class="user-dropdown" id="user-dropdown" style="display:none;">
              <div class="user-dropdown-info" id="user-dropdown-info"></div>
              <button class="user-dropdown-item user-dropdown-item--danger" id="logout-btn">Sign Out</button>
            </div>
          </div>
        </div>
      </header>

      <main class="page-content" id="page-content">
        <div class="page-loading">Loading…</div>
      </main>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Shared JS from /home/ -->
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script src="../../assets/js/api.js"></script>
  <!-- HRMS pages -->
  <script src="./assets/js/pages/payroll.js"></script>
  <!-- HRMS shell (must load last) -->
  <script src="./assets/js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/home/hrms/sw.js', { scope: '/home/hrms/' })
          .catch(err => console.warn('[HRMS SW] Registration failed:', err))
      })
    }
  </script>

</body>
</html>
